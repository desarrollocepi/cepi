# Cabeceras de seguridad de las superficies web de CEPI.
#
# Va en un snippet y no suelto en el server porque en nginx un `add_header` de un
# nivel más específico NO se suma a los del padre: los reemplaza. Como la app
# sirve el HTML por `try_files … /index.html`, la petición cae por redirección
# interna en `location = /index.html`, que ya declara su propio Cache-Control —
# y sin repetir estas cabeceras ahí, la PÁGINA salía sin ninguna mientras los
# assets sí las traían, que es lo que despista al revisarlo.
#
# Por eso se incluye tanto en el server como en cada location que declare su
# propio add_header.

# SAMEORIGIN y no DENY: la app se sigue pudiendo enmarcar desde su mismo origen
# (la Ficha que cargan las apps nativas), y se bloquea el clickjacking de terceros.
add_header X-Frame-Options "SAMEORIGIN" always;

# Detrás de login no hay nada que indexar.
add_header X-Robots-Tag "noindex, nofollow" always;

# Manda el origen pero nunca la ruta a un tercero. Las rutas van en el fragmento
# (`/#/casos/caso/<id>`), que no viaja en el Referer, así que ningún id de
# paciente se filtra; esto fija además el comportamiento en navegadores viejos.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Que el navegador respete el Content-Type en vez de adivinarlo.
add_header X-Content-Type-Options "nosniff" always;

# Sin HSTS a propósito: los navegadores lo cachean por max-age y volver atrás es
# lento y doloroso. Se agrega cuando se decida explícitamente.
