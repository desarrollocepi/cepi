# CEPI producción — un solo build sirve las dos superficies (PAPER §22):
# el hostname decide con qué vista arranca la app, así que casos.cepi.ec y
# telemedicina.cepi.ec comparten root y difieren solo en el nombre.
server {
    server_name casos.cepi.ec telemedicina.cepi.ec;

    root /opt/cepi/cepi-frontend/dist;
    index index.html;
    client_max_body_size 50m;

    # cepi-bot (chat, ficha del portal, icd, imágenes) — el prefijo más largo gana
    location /api/bot/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    # TodoERP (auth, entities, attachments, drpro)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /telegram {
        proxy_pass http://127.0.0.1:9998;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /whatsapp {
        proxy_pass http://127.0.0.1:9997;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PWA: el service worker y el manifest nunca se cachean, o los clientes se
    # quedan pegados a una versión vieja de la app.
    # Cabeceras de seguridad (ver el snippet).
    include snippets/cepi-seguridad.conf;

    location = /sw.js                { add_header Cache-Control "no-cache"; include snippets/cepi-seguridad.conf; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; include snippets/cepi-seguridad.conf; try_files $uri =404; }
    location = /index.html           { add_header Cache-Control "no-cache"; include snippets/cepi-seguridad.conf; try_files $uri =404; }

    location / { try_files $uri $uri/ /index.html; }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/casos.cepi.ec/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/casos.cepi.ec/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = telemedicina.cepi.ec) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = casos.cepi.ec) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name casos.cepi.ec telemedicina.cepi.ec;
    return 404; # managed by Certbot




}