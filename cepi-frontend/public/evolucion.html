<!DOCTYPE html>
<!--
  Ficha de evolución del paciente (PAPER §28, D-Aux-28).
  Documento hermano de ficha.html: mismo papel A4, misma cabecera y mismas barras de
  sección. Crece hacia abajo, así que al imprimir sigue en las páginas que haga falta.

  Una ficha tiene varias evoluciones (PAPER §28.4): las filas se agrupan por ficha, cada
  grupo con su cabecera (motivo, apertura, estado, cuántas evoluciones) y debajo una fila
  por evolución (cita).

  fillEvolucion(data):
    data.paciente = { nombre, cedula, edad }
    data.filas    = [{ episode_id, evolution_id, motivo, estado, es_inicial, fecha, medico,
                       especialista, diagnostico, diagnostico_histopatologico, tratamiento,
                       observaciones, hallazgos, proximo_control_fecha, proximo_control_motivo }]
                    (tal como las da GET /api/patient-evolution: fichas de la más nueva a la
                    más vieja y, dentro de cada una, evoluciones igual)
    data.actual   = episode_id de la ficha que se está viendo (se resalta), opcional
    data.editable = true para que cada fila tenga «Editar» en Observaciones, opcional

  Tocar una fila llama a window.onAbrirFicha(episode_id) si quien embebe el documento
  la definió.

  Observaciones editables (data.editable): «Guardar» llama a
  window.onGuardarObservaciones(episode_id, texto, evolution_id) —el texto ya recortado— y
  la fila queda en «Guardando…». Quien embebe guarda: una evolución registrada con
  cepi-bot /api/bot/evolucion/editar; la fila armada (evolution_id null) con
  /api/bot/ficha/grupo, grupo g_7. Responde con window.observacionesGuardadas(id, texto) o
  window.errorObservaciones(id, mensaje), donde id es evolution_id o, en la fila armada,
  episode_id. Sin onGuardarObservaciones definido, el
  botón sale deshabilitado con el motivo. Impreso no aparece nada de esto.
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ficha de evolución</title>
<style>
  @page { size: A4; margin: 10mm 0; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { margin: 0; padding: 0; background: #e8e8e8; font-family: Georgia, "Times New Roman", serif; color: #222; }
  body { padding: 16px; }
  .hoja {
    width: 210mm; min-height: 297mm; margin: 0 auto;
    background: #fff; padding: 6mm 8mm; font-size: 9pt; line-height: 1.3;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
  }
  .lbl { font-weight: 700; }
  .valor { border-bottom: 1px solid #555; color: #0a3a6b; padding: 0 2px; min-height: 1.3em; }

  /* ---------- Cabecera (igual que ficha.html) ---------- */
  .header { display: grid; grid-template-columns: 70px 1fr 250px; gap: 10px; align-items: center; margin-bottom: 4px; }
  .logo { width: 70px; height: 56px; display: flex; align-items: center; justify-content: center; }
  .logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .title-bar { background: #5b9097; color: #fff; padding: 6px 10px; font-size: 14pt; font-style: italic; text-align: center; }
  .header-fields { display: grid; grid-template-columns: 70px 1fr; row-gap: 4px; column-gap: 6px; align-items: center; }
  .header-fields .lbl { text-align: right; }

  /* ---------- Barra de sección (igual que ficha.html) ---------- */
  .section { margin-top: 8px; }
  .section-bar {
    display: flex; align-items: center; gap: 6px; color: #fff; font-weight: 700; font-size: 11pt;
    padding: 2px 12px; width: max-content; min-width: 150px; background: #5b9097;
  }
  .section-line { height: 2px; margin-top: -2px; background: #5b9097; }
  .section-body { padding: 6px 4px 2px 4px; }

  /* ---------- Tabla de evolución ---------- */
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead { display: table-header-group; } /* se repite en cada página impresa */
  th { text-align: left; font-size: 9pt; padding: 4px 6px; border-bottom: 2px solid #5b9097; }
  td { vertical-align: top; padding: 5px 6px; border-bottom: 1px solid #999; color: #0a3a6b; white-space: pre-wrap; word-wrap: break-word; }
  tr { break-inside: avoid; }
  /* Seis columnas en 194 mm: fecha y quién atendió fijas, el resto se reparte. */
  table { font-size: 8.5pt; }
  col.c-fecha { width: 19mm; } col.c-medico { width: 30mm; }
  .especialista { display: block; margin-top: 2px; font-size: 8pt; color: #3b6e75; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: #f2f7f7; }
  tr.actual td { background: #fffbe8; }
  tr.actual td:first-child { box-shadow: inset 3px 0 0 #5b9097; }
  td.vacio { color: #999; font-style: italic; }
  .estado { color: #555; font-style: italic; padding: 10px 6px; }
  /* Cabecera de cada ficha: agrupa sus evoluciones. */
  tr.ficha-cab td { padding: 7px 6px 4px; color: #222; background: #eef4f5; border-bottom: 1px solid #5b9097; cursor: pointer; }
  tr.ficha-cab .motivo { font-weight: 700; }
  tr.ficha-cab .meta { color: #555; font-style: italic; margin-left: 6px; }
  tr.ficha-cab.actual td { background: #fff3c4; }
  tr.ficha-control td { padding: 4px 6px 8px; font-size: 8.5pt; color: #333; border-bottom: 1px solid #5b9097; }
  tr.ficha-control .control-estado { font-weight: 700; }
  tr.ficha-control.control-atrasado .control-estado { color: #DC2626; }
  .extra { display: block; margin-top: 2px; font-size: 8pt; color: #3b6e75; }

  @media (max-width: 820px) {
    body { padding: 0; }
    .hoja { width: auto; min-height: 0; box-shadow: none; }
    .header { grid-template-columns: 56px 1fr; }
    .header-fields { grid-column: 1 / -1; }
  }
  /* Teléfono (la pestaña Evolución de las apps carga este documento): cada ficha es una
     tarjeta con la etiqueta de cada dato. Solo en pantalla; impreso sigue la tabla. */
  @media screen and (max-width: 600px) {
    .hoja { padding: 4mm 3mm; font-size: 10pt; }
    table, tbody { display: block; }
    colgroup, thead { display: none; }
    tbody tr { display: block; padding: 6px 0; border-bottom: 1px solid #999; }
    td { display: grid; grid-template-columns: 34% 1fr; gap: 6px; padding: 3px 4px; border: 0; }
    td::before { content: attr(data-col); font-weight: 700; color: #222; font-style: normal; }
    td.estado, tr.ficha-cab td { display: block; }
    td.estado::before, tr.ficha-cab td::before { content: none; }
    .extra { grid-column: 2; }
    .especialista { grid-column: 2; }
  }
  /* Edición de observaciones (data.editable). */
  .obs-acciones button {
    margin-top: 4px; padding: 3px 9px; font: 600 8.5pt -apple-system, system-ui, sans-serif; color: #2f5f66;
    background: #fff; border: 1px solid #9cc3c8; border-radius: 6px; cursor: pointer;
  }
  .obs-acciones button:disabled { color: #aaa; border-color: #ddd; cursor: default; }
  .obs-linea { display: flex; align-items: flex-start; gap: 6px; }
  .obs-editar { flex-shrink: 0; margin-left: auto; padding: 0 4px; font-size: 12pt; line-height: 1.2; background: none; border: 0; border-radius: 4px; cursor: pointer; }
  .obs-editar:disabled { opacity: .35; filter: grayscale(1); cursor: default; }
  .obs-texto { width: 100%; box-sizing: border-box; padding: 5px; font: 10pt -apple-system, system-ui, sans-serif; border: 1px solid #888; border-radius: 6px; }
  .obs-acciones { display: flex; gap: 6px; }
  .obs-error { margin: 4px 0 0; color: #b91c1c; font: 8.5pt -apple-system, system-ui, sans-serif; }
  td.obs { cursor: default; }
  @media print {
    .obs-editar, .obs-acciones, .obs-error { display: none !important; }
    body { background: #fff; padding: 0; }
    .hoja { box-shadow: none; margin: 0; min-height: 0; }
    td { color: #000; }
    tr.actual td { background: transparent; box-shadow: none; }
    tr.ficha-cab td, tr.ficha-cab.actual td { background: #eef4f5; }
    tbody tr:hover td { background: transparent; }
  }
</style>
</head>
<body>
<div class="hoja">
  <div class="header">
    <div class="logo"><img src="logo_black.png" alt="CEPI Centro de la Piel"></div>
    <div class="title-bar">Ficha de Evoluci&oacute;n</div>
    <div class="header-fields">
      <span class="lbl">Paciente:</span> <span class="valor" id="f-nombre"></span>
      <span class="lbl">C&eacute;dula:</span> <span class="valor" id="f-cedula"></span>
      <span class="lbl">Edad:</span> <span class="valor" id="f-edad"></span>
    </div>
  </div>

  <section class="section">
    <div class="section-bar">Evoluci&oacute;n <span id="f-cuenta" style="font-weight:400"></span></div>
    <div class="section-line"></div>
    <div class="section-body">
      <table>
        <colgroup><col class="c-fecha"><col class="c-medico"><col><col><col><col></colgroup>
        <thead><tr>
          <th>Fecha</th><th>Atendi&oacute;</th><th>Diagn&oacute;stico cl&iacute;nico</th>
          <th>Diagn&oacute;stico histopatol&oacute;gico</th><th>Tratamiento</th><th>Observaciones</th>
        </tr></thead>
        <tbody id="f-filas"><tr><td colspan="6" class="estado">Cargando la evoluci&oacute;n…</td></tr></tbody>
      </table>
    </div>
  </section>
</div>

<script>
function celda(texto, vacio, columna) {
  const td = document.createElement('td');
  if (columna) td.dataset.col = columna;
  if (texto) td.textContent = texto;
  else { td.textContent = vacio; td.className = 'vacio'; }
  return td;
}

function fillEvolucion(data) {
  const p = (data && data.paciente) || {};
  document.getElementById('f-nombre').textContent = p.nombre || '';
  document.getElementById('f-cedula').textContent = p.cedula || '';
  document.getElementById('f-edad').textContent = p.edad != null && p.edad !== '' ? p.edad + ' años' : '';

  const filas = (data && data.filas) || [];
  const grupos = agrupar(filas);
  const nF = grupos.length;
  document.getElementById('f-cuenta').textContent = `· ${nF === 1 ? '1 ficha' : nF + ' fichas'} · ${filas.length === 1 ? '1 evolución' : filas.length + ' evoluciones'}`;
  const tbody = document.getElementById('f-filas');
  tbody.textContent = '';
  Object.keys(celdasObs).forEach((k) => delete celdasObs[k]);
  obsEnEdicion = null;
  if (!filas.length) {
    const tr = document.createElement('tr');
    const td = celda('Este paciente todavía no tiene fichas registradas.');
    td.colSpan = 6; td.className = 'estado';
    tr.appendChild(td); tbody.appendChild(tr);
    return;
  }
  const abrir = (id) => { if (typeof window.onAbrirFicha === 'function') window.onAbrirFicha(id); };
  for (const g of grupos) {
    const actual = data.actual && g.episode_id === data.actual;
    const cab = document.createElement('tr');
    cab.className = 'ficha-cab' + (actual ? ' actual' : '');
    cab.title = actual ? 'Es la ficha que estás viendo' : 'Abrir esta ficha';
    const tdc = document.createElement('td');
    tdc.colSpan = 6;
    const motivo = document.createElement('span');
    motivo.className = 'motivo';
    motivo.textContent = 'Ficha: ' + (g.motivo || 'sin motivo registrado');
    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = `abierta el ${g.apertura || '—'} · ${etiquetaEstado(g.estado)} · ${g.filas.length === 1 ? '1 evolución' : g.filas.length + ' evoluciones'}`;
    tdc.appendChild(motivo); tdc.appendChild(meta);
    cab.appendChild(tdc);
    cab.addEventListener('click', () => abrir(g.episode_id));
    tbody.appendChild(cab);
    // La más vieja arriba y la más nueva abajo, encima de su próximo control (PAPER §28.4.1).
    for (const f of [...g.filas].reverse()) {
      const tr = document.createElement('tr');
      if (actual) tr.className = 'actual';
      tr.title = actual ? 'Es la ficha que estás viendo' : 'Abrir esta ficha';
      const fecha = celda(f.fecha, '—', 'Fecha');
      if (f.es_inicial && f.evolution_id) fecha.appendChild(extra('Primera cita'));
      tr.appendChild(fecha);
      const atendio = celda(f.medico, '—', 'Atendió');
      if (f.especialista) {
        const esp = document.createElement('span');
        esp.className = 'especialista';
        esp.textContent = 'Especialista: ' + f.especialista;
        atendio.appendChild(esp);
      }
      tr.appendChild(atendio);
      const dx = celda(f.diagnostico, 'Sin diagnóstico', 'Dx clínico');
      if (f.hallazgos) dx.appendChild(extra('Hallazgos: ' + f.hallazgos));
      tr.appendChild(dx);
      tr.appendChild(celda(f.diagnostico_histopatologico, 'Sin biopsia', 'Dx histopatológico'));
      const tto = celda(f.tratamiento, 'Sin tratamiento', 'Tratamiento');
      const control = [f.proximo_control_fecha, f.proximo_control_motivo].filter(Boolean).join(' · ');
      if (control) tto.appendChild(extra('Próximo control: ' + control));
      tr.appendChild(tto);
      tr.appendChild(data.editable ? celdaObservaciones(f) : celda(f.observaciones, 'Sin observaciones', 'Observaciones'));
      tr.addEventListener('click', () => abrir(f.episode_id));
      tbody.appendChild(tr);
    }
    tbody.appendChild(nextControlRow(g));
  }
}

/** 'YYYY-MM-DD' de hoy en la zona del dispositivo (nunca toISOString: da el día UTC). */
function localToday(d = new Date()) {
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

/** Al pie de cada ficha, su próximo control: el de la evolución más nueva (PAPER §28.4). */
function nextControlRow(g) {
  const latest = g.filas[0] || {};
  const date = latest.proximo_control_fecha || null;
  const tr = document.createElement('tr');
  tr.className = 'ficha-control';
  const td = document.createElement('td');
  td.colSpan = 6;
  const title = document.createElement('strong');
  title.textContent = 'Próximo control: ';
  td.appendChild(title);
  if (!date) {
    td.appendChild(document.createTextNode(g.estado === 'alta' ? 'Ficha de alta: sin controles pendientes' : 'Sin próximo control indicado'));
  } else {
    const today = localToday();
    const status = date < today ? 'atrasado' : (date === today ? 'hoy' : 'proximo');
    tr.classList.add('control-' + status);
    const label = document.createElement('span');
    label.className = 'control-estado';
    label.textContent = { atrasado: 'Atrasado', hoy: 'Hoy', proximo: 'Próximo' }[status];
    td.appendChild(document.createTextNode(date + ' '));
    td.appendChild(label);
    td.appendChild(document.createTextNode(' · ' + (latest.proximo_control_motivo || 'sin indicación de qué hacer')));
  }
  tr.appendChild(td);
  return tr;
}

const ESTADOS = {
  agendado: 'Agendada', en_curso: 'En curso', enviada: 'Enviada', en_triage: 'En triage', derivada: 'Derivada',
  'en_revisión_solicitada': 'Revisión solicitada', respondida: 'Respondida', cerrado: 'Cerrada', alta: 'Alta',
};
function etiquetaEstado(e) { return e ? (ESTADOS[e] || String(e).replace(/_/g, ' ')) : 'sin estado'; }

function extra(texto) {
  const s = document.createElement('span');
  s.className = 'extra';
  s.textContent = texto;
  return s;
}

/** Filas agrupadas por ficha, en el orden en que llegan. La apertura es la cita más vieja. */
function agrupar(filas) {
  const out = [];
  const porId = {};
  for (const f of filas) {
    let g = porId[f.episode_id];
    if (!g) {
      g = { episode_id: f.episode_id, motivo: f.motivo || null, estado: f.estado || null, filas: [] };
      porId[f.episode_id] = g;
      out.push(g);
    }
    g.filas.push(f);
  }
  for (const g of out) g.apertura = g.filas[g.filas.length - 1].fecha || null;
  return out;
}

// ---------- Observaciones editables ----------
const celdasObs = {};   // evolution_id (o episode_id en la fila armada) → { td, fila, editando }
const claveObs = (f) => f.evolution_id || f.episode_id;
let obsEnEdicion = null;

function celdaObservaciones(f) {
  const td = document.createElement('td');
  td.dataset.col = 'Observaciones';
  td.className = 'obs';
  // El toque dentro de la celda no abre la ficha de la fila.
  td.addEventListener('click', (e) => e.stopPropagation());
  celdasObs[claveObs(f)] = { td, fila: f };
  pintarObs(claveObs(f));
  return td;
}

function boton(texto, alTocar, deshabilitado, motivo) {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = texto; b.disabled = !!deshabilitado;
  if (motivo) b.title = motivo;
  b.addEventListener('click', alTocar);
  return b;
}

function pintarObs(id, error) {
  const c = celdasObs[id]; if (!c) return;
  const { td, fila } = c;
  td.textContent = '';
  td.classList.toggle('vacio', !fila.observaciones && obsEnEdicion !== id);
  const cuerpo = document.createElement('div');
  td.appendChild(cuerpo);
  if (obsEnEdicion !== id) {
    const span = document.createElement('span');
    span.textContent = fila.observaciones || 'Sin observaciones';
    cuerpo.appendChild(span);
    const sinHost = typeof window.onGuardarObservaciones !== 'function';
    const otra = obsEnEdicion && obsEnEdicion !== id;
    const motivo = sinHost ? 'Esta vista no puede guardar' : (otra ? 'Termina primero la otra observación' : 'Editar las observaciones de esta cita');
    const b = boton('✏️', () => editarObs(id), sinHost || otra, motivo);
    b.className = 'obs-editar';
    b.setAttribute('aria-label', motivo);
    cuerpo.className = 'obs-linea';
    cuerpo.appendChild(b);
    return;
  }
  const area = document.createElement('textarea');
  area.className = 'obs-texto'; area.rows = 3;
  area.placeholder = 'Resumen de lo más importante de esta cita';
  area.value = c.borrador != null ? c.borrador : (fila.observaciones || '');
  area.disabled = !!c.guardando;
  cuerpo.appendChild(area);
  if (error) {
    const p = document.createElement('p'); p.className = 'obs-error'; p.textContent = error;
    cuerpo.appendChild(p);
  }
  const acciones = document.createElement('div'); acciones.className = 'obs-acciones';
  const guardar = boton(c.guardando ? 'Guardando…' : 'Guardar', () => {
    const texto = area.value.trim();
    c.borrador = area.value; c.guardando = true;
    pintarObs(id);
    window.onGuardarObservaciones(fila.episode_id, texto, fila.evolution_id || null);
  }, c.guardando, c.guardando ? 'Guardando…' : 'Guardar en la ficha');
  const cancelar = boton('Cancelar', () => { obsEnEdicion = null; c.borrador = null; repintarObs(); }, c.guardando);
  // Sin cambios no hay nada que guardar.
  const sinCambios = () => area.value.trim() === (fila.observaciones || '');
  if (!c.guardando) {
    guardar.disabled = sinCambios();
    guardar.title = sinCambios() ? 'No hay cambios que guardar' : 'Guardar en la ficha';
    area.addEventListener('input', () => {
      guardar.disabled = sinCambios();
      guardar.title = sinCambios() ? 'No hay cambios que guardar' : 'Guardar en la ficha';
    });
  }
  acciones.appendChild(guardar); acciones.appendChild(cancelar);
  cuerpo.appendChild(acciones);
  if (!c.guardando) area.focus();
}

function repintarObs() { Object.keys(celdasObs).forEach((id) => pintarObs(id)); }

function editarObs(id) {
  obsEnEdicion = id;
  celdasObs[id].borrador = null;
  repintarObs();
}

// Respuestas de quien embebe.
// Quien embebe responde con evolution_id o, como antes, con episode_id: en ese caso es
// la celda que se está editando de esa ficha.
function celdaDe(id) {
  if (celdasObs[id]) return { id, c: celdasObs[id] };
  if (obsEnEdicion && celdasObs[obsEnEdicion] && celdasObs[obsEnEdicion].fila.episode_id === id) {
    return { id: obsEnEdicion, c: celdasObs[obsEnEdicion] };
  }
  return { id, c: null };
}

function observacionesGuardadas(idRespuesta, texto) {
  const { c } = celdaDe(idRespuesta); if (!c) return;
  c.fila.observaciones = texto || null;
  c.guardando = false; c.borrador = null;
  obsEnEdicion = null;
  repintarObs();
}

function errorObservaciones(idRespuesta, mensaje) {
  const { id, c } = celdaDe(idRespuesta); if (!c) return;
  c.guardando = false;
  pintarObs(id, mensaje || 'No se pudo guardar');
}

window.observacionesGuardadas = observacionesGuardadas;
window.errorObservaciones = errorObservaciones;

// Error de carga del lado de quien embebe: se dice en la propia hoja.
function errorEvolucion(mensaje) {
  const tbody = document.getElementById('f-filas');
  tbody.textContent = '';
  const tr = document.createElement('tr');
  const td = celda(mensaje || 'No se pudo cargar la evolución');
  td.colSpan = 6; td.className = 'estado';
  tr.appendChild(td); tbody.appendChild(tr);
}

window.fillEvolucion = fillEvolucion;
window.errorEvolucion = errorEvolucion;
</script>
</body>
</html>
