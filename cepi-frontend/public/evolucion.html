<!DOCTYPE html>
<!--
  Ficha de evolución del paciente (PAPER §28, D-Aux-28).
  Documento hermano de ficha.html: mismo papel A4, misma cabecera y mismas barras de
  sección. Es de solo lectura y crece hacia abajo (una fila por ficha), así que al
  imprimir sigue en las páginas que haga falta.

  fillEvolucion(data):
    data.paciente = { nombre, cedula, edad }
    data.filas    = [{ episode_id, fecha, medico, especialista, diagnostico,
                       diagnostico_histopatologico, tratamiento, observaciones }]  (la más nueva primero)
    data.actual   = episode_id de la ficha que se está viendo (se resalta), opcional
    data.editable = true para que cada fila tenga «Editar» en Observaciones, opcional

  Tocar una fila llama a window.onAbrirFicha(episode_id) si quien embebe el documento
  la definió.

  Observaciones editables (data.editable, lo usan las apps): «Guardar» llama a
  window.onGuardarObservaciones(episode_id, texto) —el texto ya recortado— y la fila queda
  en «Guardando…». Quien embebe guarda (cepi-bot /api/bot/ficha/grupo, grupo g_7) y responde
  con window.observacionesGuardadas(episode_id, texto) o
  window.errorObservaciones(episode_id, mensaje). Sin onGuardarObservaciones definido, el
  botón sale deshabilitado con el motivo. Impreso no aparece nada de esto.
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ficha de evolución</title>
<style>
  @page { size: A4; margin: 10mm 0; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { margin: 0; padding: 0; background: #e8e8e8; font-family: Georgia, "Times New Roman", serif; color: #222; }
  body { padding: 16px; }
  .hoja {
    width: 210mm; min-height: 297mm; margin: 0 auto;
    background: #fff; padding: 6mm 8mm; font-size: 9pt; line-height: 1.3;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
  }
  .lbl { font-weight: 700; }
  .valor { border-bottom: 1px solid #555; color: #0a3a6b; padding: 0 2px; min-height: 1.3em; }

  /* ---------- Cabecera (igual que ficha.html) ---------- */
  .header { display: grid; grid-template-columns: 70px 1fr 250px; gap: 10px; align-items: center; margin-bottom: 4px; }
  .logo { width: 70px; height: 56px; display: flex; align-items: center; justify-content: center; }
  .logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .title-bar { background: #5b9097; color: #fff; padding: 6px 10px; font-size: 14pt; font-style: italic; text-align: center; }
  .header-fields { display: grid; grid-template-columns: 70px 1fr; row-gap: 4px; column-gap: 6px; align-items: center; }
  .header-fields .lbl { text-align: right; }

  /* ---------- Barra de sección (igual que ficha.html) ---------- */
  .section { margin-top: 8px; }
  .section-bar {
    display: flex; align-items: center; gap: 6px; color: #fff; font-weight: 700; font-size: 11pt;
    padding: 2px 12px; width: max-content; min-width: 150px; background: #5b9097;
  }
  .section-line { height: 2px; margin-top: -2px; background: #5b9097; }
  .section-body { padding: 6px 4px 2px 4px; }

  /* ---------- Tabla de evolución ---------- */
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead { display: table-header-group; } /* se repite en cada página impresa */
  th { text-align: left; font-size: 9pt; padding: 4px 6px; border-bottom: 2px solid #5b9097; }
  td { vertical-align: top; padding: 5px 6px; border-bottom: 1px solid #999; color: #0a3a6b; white-space: pre-wrap; word-wrap: break-word; }
  tr { break-inside: avoid; }
  /* Seis columnas en 194 mm: fecha y quién atendió fijas, el resto se reparte. */
  table { font-size: 8.5pt; }
  col.c-fecha { width: 19mm; } col.c-medico { width: 30mm; }
  .especialista { display: block; margin-top: 2px; font-size: 8pt; color: #3b6e75; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: #f2f7f7; }
  tr.actual td { background: #fffbe8; }
  tr.actual td:first-child { box-shadow: inset 3px 0 0 #5b9097; }
  td.vacio { color: #999; font-style: italic; }
  .estado { color: #555; font-style: italic; padding: 10px 6px; }

  @media (max-width: 820px) {
    body { padding: 0; }
    .hoja { width: auto; min-height: 0; box-shadow: none; }
    .header { grid-template-columns: 56px 1fr; }
    .header-fields { grid-column: 1 / -1; }
  }
  /* Teléfono (la pestaña Evolución de las apps carga este documento): cada ficha es una
     tarjeta con la etiqueta de cada dato. Solo en pantalla; impreso sigue la tabla. */
  @media screen and (max-width: 600px) {
    .hoja { padding: 4mm 3mm; font-size: 10pt; }
    table, tbody { display: block; }
    colgroup, thead { display: none; }
    tbody tr { display: block; padding: 6px 0; border-bottom: 1px solid #999; }
    td { display: grid; grid-template-columns: 34% 1fr; gap: 6px; padding: 3px 4px; border: 0; }
    td::before { content: attr(data-col); font-weight: 700; color: #222; font-style: normal; }
    td.estado { display: block; }
    td.estado::before { content: none; }
    .especialista { grid-column: 2; }
  }
  /* Edición de observaciones (data.editable). */
  .obs-editar, .obs-acciones button {
    margin-top: 4px; padding: 3px 9px; font: 600 8.5pt -apple-system, system-ui, sans-serif; color: #2f5f66;
    background: #fff; border: 1px solid #9cc3c8; border-radius: 6px; cursor: pointer;
  }
  .obs-editar { display: block; }
  .obs-editar:disabled, .obs-acciones button:disabled { color: #aaa; border-color: #ddd; cursor: default; }
  .obs-texto { width: 100%; box-sizing: border-box; padding: 5px; font: 10pt -apple-system, system-ui, sans-serif; border: 1px solid #888; border-radius: 6px; }
  .obs-acciones { display: flex; gap: 6px; }
  .obs-error { margin: 4px 0 0; color: #b91c1c; font: 8.5pt -apple-system, system-ui, sans-serif; }
  td.obs { cursor: default; }
  @media print {
    .obs-editar, .obs-acciones, .obs-error { display: none !important; }
    body { background: #fff; padding: 0; }
    .hoja { box-shadow: none; margin: 0; min-height: 0; }
    td { color: #000; }
    tr.actual td { background: transparent; box-shadow: none; }
    tbody tr:hover td { background: transparent; }
  }
</style>
</head>
<body>
<div class="hoja">
  <div class="header">
    <div class="logo"><img src="logo_black.png" alt="CEPI Centro de la Piel"></div>
    <div class="title-bar">Ficha de Evoluci&oacute;n</div>
    <div class="header-fields">
      <span class="lbl">Paciente:</span> <span class="valor" id="f-nombre"></span>
      <span class="lbl">C&eacute;dula:</span> <span class="valor" id="f-cedula"></span>
      <span class="lbl">Edad:</span> <span class="valor" id="f-edad"></span>
    </div>
  </div>

  <section class="section">
    <div class="section-bar">Evoluci&oacute;n <span id="f-cuenta" style="font-weight:400"></span></div>
    <div class="section-line"></div>
    <div class="section-body">
      <table>
        <colgroup><col class="c-fecha"><col class="c-medico"><col><col><col><col></colgroup>
        <thead><tr>
          <th>Fecha</th><th>Atendi&oacute;</th><th>Diagn&oacute;stico cl&iacute;nico</th>
          <th>Diagn&oacute;stico histopatol&oacute;gico</th><th>Tratamiento</th><th>Observaciones</th>
        </tr></thead>
        <tbody id="f-filas"><tr><td colspan="6" class="estado">Cargando la evoluci&oacute;n…</td></tr></tbody>
      </table>
    </div>
  </section>
</div>

<script>
function celda(texto, vacio, columna) {
  const td = document.createElement('td');
  if (columna) td.dataset.col = columna;
  if (texto) td.textContent = texto;
  else { td.textContent = vacio; td.className = 'vacio'; }
  return td;
}

function fillEvolucion(data) {
  const p = (data && data.paciente) || {};
  document.getElementById('f-nombre').textContent = p.nombre || '';
  document.getElementById('f-cedula').textContent = p.cedula || '';
  document.getElementById('f-edad').textContent = p.edad != null && p.edad !== '' ? p.edad + ' años' : '';

  const filas = (data && data.filas) || [];
  document.getElementById('f-cuenta').textContent = filas.length === 1 ? '· 1 ficha' : `· ${filas.length} fichas`;
  const tbody = document.getElementById('f-filas');
  tbody.textContent = '';
  Object.keys(celdasObs).forEach((k) => delete celdasObs[k]);
  obsEnEdicion = null;
  if (!filas.length) {
    const tr = document.createElement('tr');
    const td = celda('Este paciente todavía no tiene fichas registradas.');
    td.colSpan = 6; td.className = 'estado';
    tr.appendChild(td); tbody.appendChild(tr);
    return;
  }
  for (const f of filas) {
    const tr = document.createElement('tr');
    const actual = data.actual && f.episode_id === data.actual;
    if (actual) tr.className = 'actual';
    tr.title = actual ? 'Es la ficha que estás viendo' : 'Abrir esta ficha';
    tr.appendChild(celda(f.fecha, '—', 'Fecha'));
    const atendio = celda(f.medico, '—', 'Atendió');
    if (f.especialista) {
      const esp = document.createElement('span');
      esp.className = 'especialista';
      esp.textContent = 'Especialista: ' + f.especialista;
      atendio.appendChild(esp);
    }
    tr.appendChild(atendio);
    tr.appendChild(celda(f.diagnostico, 'Sin diagnóstico', 'Dx clínico'));
    tr.appendChild(celda(f.diagnostico_histopatologico, 'Sin biopsia', 'Dx histopatológico'));
    tr.appendChild(celda(f.tratamiento, 'Sin tratamiento', 'Tratamiento'));
    tr.appendChild(data.editable ? celdaObservaciones(f) : celda(f.observaciones, 'Sin observaciones', 'Observaciones'));
    tr.addEventListener('click', () => {
      if (typeof window.onAbrirFicha === 'function') window.onAbrirFicha(f.episode_id);
    });
    tbody.appendChild(tr);
  }
}

// ---------- Observaciones editables ----------
const celdasObs = {};   // episode_id → { td, fila, editando }
let obsEnEdicion = null;

function celdaObservaciones(f) {
  const td = document.createElement('td');
  td.dataset.col = 'Observaciones';
  td.className = 'obs';
  // El toque dentro de la celda no abre la ficha de la fila.
  td.addEventListener('click', (e) => e.stopPropagation());
  celdasObs[f.episode_id] = { td, fila: f };
  pintarObs(f.episode_id);
  return td;
}

function boton(texto, alTocar, deshabilitado, motivo) {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = texto; b.disabled = !!deshabilitado;
  if (motivo) b.title = motivo;
  b.addEventListener('click', alTocar);
  return b;
}

function pintarObs(id, error) {
  const c = celdasObs[id]; if (!c) return;
  const { td, fila } = c;
  td.textContent = '';
  td.classList.toggle('vacio', !fila.observaciones && obsEnEdicion !== id);
  const cuerpo = document.createElement('div');
  td.appendChild(cuerpo);
  if (obsEnEdicion !== id) {
    const span = document.createElement('span');
    span.textContent = fila.observaciones || 'Sin observaciones';
    cuerpo.appendChild(span);
    const sinHost = typeof window.onGuardarObservaciones !== 'function';
    const otra = obsEnEdicion && obsEnEdicion !== id;
    const b = boton('✏️ Editar', () => editarObs(id), sinHost || otra,
      sinHost ? 'Esta vista no puede guardar' : (otra ? 'Termina primero la otra observación' : 'Editar las observaciones de esta ficha'));
    b.className = 'obs-editar';
    cuerpo.appendChild(b);
    return;
  }
  const area = document.createElement('textarea');
  area.className = 'obs-texto'; area.rows = 3;
  area.placeholder = 'Resumen de lo más importante de esta ficha';
  area.value = c.borrador != null ? c.borrador : (fila.observaciones || '');
  area.disabled = !!c.guardando;
  cuerpo.appendChild(area);
  if (error) {
    const p = document.createElement('p'); p.className = 'obs-error'; p.textContent = error;
    cuerpo.appendChild(p);
  }
  const acciones = document.createElement('div'); acciones.className = 'obs-acciones';
  const guardar = boton(c.guardando ? 'Guardando…' : 'Guardar', () => {
    const texto = area.value.trim();
    c.borrador = area.value; c.guardando = true;
    pintarObs(id);
    window.onGuardarObservaciones(id, texto);
  }, c.guardando, c.guardando ? 'Guardando…' : 'Guardar en la ficha');
  const cancelar = boton('Cancelar', () => { obsEnEdicion = null; c.borrador = null; repintarObs(); }, c.guardando);
  // Sin cambios no hay nada que guardar.
  const sinCambios = () => area.value.trim() === (fila.observaciones || '');
  if (!c.guardando) {
    guardar.disabled = sinCambios();
    guardar.title = sinCambios() ? 'No hay cambios que guardar' : 'Guardar en la ficha';
    area.addEventListener('input', () => {
      guardar.disabled = sinCambios();
      guardar.title = sinCambios() ? 'No hay cambios que guardar' : 'Guardar en la ficha';
    });
  }
  acciones.appendChild(guardar); acciones.appendChild(cancelar);
  cuerpo.appendChild(acciones);
  if (!c.guardando) area.focus();
}

function repintarObs() { Object.keys(celdasObs).forEach((id) => pintarObs(id)); }

function editarObs(id) {
  obsEnEdicion = id;
  celdasObs[id].borrador = null;
  repintarObs();
}

// Respuestas de quien embebe.
function observacionesGuardadas(id, texto) {
  const c = celdasObs[id]; if (!c) return;
  c.fila.observaciones = texto || null;
  c.guardando = false; c.borrador = null;
  obsEnEdicion = null;
  repintarObs();
}

function errorObservaciones(id, mensaje) {
  const c = celdasObs[id]; if (!c) return;
  c.guardando = false;
  pintarObs(id, mensaje || 'No se pudo guardar');
}

window.observacionesGuardadas = observacionesGuardadas;
window.errorObservaciones = errorObservaciones;

// Error de carga del lado de quien embebe: se dice en la propia hoja.
function errorEvolucion(mensaje) {
  const tbody = document.getElementById('f-filas');
  tbody.textContent = '';
  const tr = document.createElement('tr');
  const td = celda(mensaje || 'No se pudo cargar la evolución');
  td.colSpan = 6; td.className = 'estado';
  tr.appendChild(td); tbody.appendChild(tr);
}

window.fillEvolucion = fillEvolucion;
window.errorEvolucion = errorEvolucion;
</script>
</body>
</html>
